name: MWS Renew

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00，每天跑（MWS 续期要人工过 Turnstile，靠每天检查剩余时间发提醒）
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      remind_hours:
        description: '剩余多少小时以内发提醒（留空=96）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛠️ 安装依赖
        run: pip install -r requirements.txt

      - name: 🚀 运行续期脚本
        env:
          MWS_TOKEN: ${{ secrets.MWS_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # 通知：优先直发自己的 Telegram（Bot API）
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TG_API_BASE: ${{ secrets.TG_API_BASE }}
          # 可选回退：原作者的 notify-gateway（不配就不用，两者都没配时只在日志里告警）
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          MWS_REMIND_HOURS: ${{ github.event.inputs.remind_hours }}
          TZ: Asia/Shanghai
        run: python3 renew.py
