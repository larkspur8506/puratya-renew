name: MWS Renew

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00，每周一三五跑（API 被 Turnstile 拦时走浏览器+代理）
    - cron: '0 1 * * 1,3,5'
  workflow_dispatch:
    inputs:
      remind_hours:
        description: '剩余多少小时以内发提醒（留空=96）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛠️ 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install -r requirements.txt seleniumbase
          seleniumbase install chromedriver

      - name: ⚙ 安装 sing-box
        run: |
          set -e
          VER=1.11.15
          curl -fsSL -o /tmp/sing-box.tgz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tgz -C /tmp
          sudo install -m 0755 /tmp/sing-box-${VER}-linux-amd64/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: 🚀 运行续期脚本
        env:
          MWS_TOKEN: ${{ secrets.MWS_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # 通知：优先直发自己的 Telegram（Bot API）
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TG_API_BASE: ${{ secrets.TG_API_BASE }}
          # 可选回退：原作者的 notify-gateway（不配就不用，两者都没配时只在日志里告警）
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          MWS_REMIND_HOURS: ${{ github.event.inputs.remind_hours }}
          # 代理节点（tuic:// / hysteria2:// / vless:// / vmess:// / trojan://），用来过 CF Turnstile
          NODE_LINK: ${{ secrets.NODE_LINK }}
          MWS_WEB_RENEW: '1'
          MWS_HEADLESS: '0'
          TZ: Asia/Shanghai
        run: xvfb-run -a python3 renew.py

      - name: 📷 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-renew-screenshots
          path: "web-renew-*.png"
          if-no-files-found: ignore
